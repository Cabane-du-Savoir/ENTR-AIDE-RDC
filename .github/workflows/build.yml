name: Build ENTR'AIDE RDC (Web & Release)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: 🌐 1. Compilation Web Production (dist)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4

      - name: ⚙️ Configurer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Installer les dépendances
        run: npm install --legacy-peer-deps

      - name: 🏗️ Compiler l'application (Vite build)
        run: npm run build

      - name: 🗜️ Compresser le build (dist.zip)
        run: |
          cd dist && zip -r ../entraide-rdc-web-dist.zip . && cd ..

      - name: 🚀 Publier le build dans les Releases GitHub (Contourne le quota d'artefacts)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0-build
          name: "ENTR'AIDE RDC - Build de Production Web & PWA"
          body: |
            ### 📦 Build de production généré avec succès !
            
            Téléchargez le fichier **`entraide-rdc-web-dist.zip`** ci-dessous pour déployer votre application ou générer votre APK Android via [PWABuilder](https://www.pwabuilder.com).
          files: entraide-rdc-web-dist.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 📤 Exporter le livrable Web (Artifact secondaire)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: entraide-rdc-web-dist
          path: dist/
          retention-days: 1
