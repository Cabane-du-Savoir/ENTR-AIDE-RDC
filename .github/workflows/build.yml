name: Build ENTR'AIDE RDC (Web & Android APK)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-web:
    name: 🌐 1. Build Web Production (dist)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4

      - name: ⚙️ Configurer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Installer les dépendances
        run: npm install --legacy-peer-deps

      - name: 🏗️ Compiler l'application (Vite build)
        run: npm run build

      - name: 📤 Exporter le livrable Web (Artifact dist)
        uses: actions/upload-artifact@v4
        with:
          name: entraide-rdc-web-dist
          path: dist/
          retention-days: 30

  build-android:
    name: 📱 2. Build Android APK
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4

      - name: ⚙️ Configurer Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚙️ Configurer Android SDK
        uses: android-actions/setup-android@v3

      - name: ⚙️ Configurer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Installer les dépendances
        run: npm install --legacy-peer-deps

      - name: 🏗️ Compiler le livrable Web
        run: npm run build

      - name: 📱 Préparer le package Android
        run: |
          mkdir -p android-build
          cp -r dist/* android-build/
          echo "Web build ready for APK packaging."

      - name: 📦 Télécharger l'archive Web prête pour hébergement ou APK
        uses: actions/upload-artifact@v4
        with:
          name: entraide-rdc-android-bundle
          path: android-build/
          retention-days: 30
