name: Build Web & Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: 📱 Compiler l'application Web & Générer l'APK Android
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4

      - name: ⚙️ Configurer Node.js 22 (requis par Capacitor)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Configurer Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🤖 Accepter les licences Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 📦 Installer les dépendances Node.js
        run: npm install --legacy-peer-deps

      - name: 🏗️ Compiler l'application Web (Vite)
        run: npm run build

      - name: 🔄 Synchroniser avec le projet Android Capacitor
        run: npx cap sync android

      - name: 🔨 Compiler le fichier APK Android avec Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk ./entraide-rdc.apk
          ls -lh entraide-rdc.apk

      - name: 🗜️ Archiver le livrable Web
        run: |
          cd dist && zip -r ../entraide-rdc-web-dist.zip . && cd ..

      - name: 🚀 Mettre à disposition l'APK et le Web dans GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0
          name: "📱 ENTR'AIDE RDC - APK Android & Application Web"
          body: |
            ## 🎉 Livrables prêts au téléchargement !
            
            ### 📱 Pour votre smartphone Android :
            Téléchargez le fichier **`entraide-rdc.apk`** ci-dessous, transférez-le sur votre téléphone ou ouvrez cette page directement depuis votre smartphone pour l'installer.
            
            ### 🌐 Pour l'hébergement Web :
            Téléchargez **`entraide-rdc-web-dist.zip`** pour déployer le site sur votre hébergeur.
          files: |
            entraide-rdc.apk
            entraide-rdc-web-dist.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
