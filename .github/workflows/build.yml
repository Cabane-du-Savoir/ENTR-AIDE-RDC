name: Build Web & Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: 📱 Compiler l'application Web & Générer l'APK Android
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4

      - name: ⚙️ Configurer Node.js 22 (requis par Capacitor)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Configurer Java JDK 21 (requis par Android Gradle 8.14)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 🤖 Accepter les licences et préparer Android SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: 📦 Installer les dépendances Node.js
        run: npm install --legacy-peer-deps

      - name: 🏗️ Compiler l'application Web (Vite)
        run: npm run build

      - name: 🔄 Synchroniser avec le projet Android Capacitor
        run: npx cap sync android

      - name: 🔨 Compiler le fichier APK Android avec Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug -x test -x lint -x check --no-daemon --stacktrace
          cd ..
          find android -name "*.apk" -exec cp {} ./entraide-rdc.apk \;
          ls -lh entraide-rdc.apk

      - name: 📱 Mettre à disposition l'APK en téléchargement direct (Artifact GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: entraide-rdc-apk
          path: entraide-rdc.apk
          if-no-files-found: error
          retention-days: 14

      - name: 🗜️ Archiver le livrable Web
        run: |
          cd dist && zip -r ../entraide-rdc-web-dist.zip . && cd ..

      - name: 🚀 Publier aussi dans GitHub Releases (si autorisé)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: "v1.0"
          name: "📱 ENTR'AIDE RDC - Application Android APK & Web"
          body: |
            ## 🎉 Livrables prêts au téléchargement !
            
            ### 📱 Pour tester sur smartphone Android :
            Téléchargez le fichier **`entraide-rdc.apk`** ci-dessous et installez-le directement sur votre téléphone.
            
            ### 🌐 Pour l'hébergement Web :
            Téléchargez **`entraide-rdc-web-dist.zip`** pour déployer le site sur votre serveur web.
          files: |
            entraide-rdc.apk
            entraide-rdc-web-dist.zip
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
